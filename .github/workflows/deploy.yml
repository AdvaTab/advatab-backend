name: Deploy backend

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Cloudflare environment
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Deploy selected environment
        run: npm run "deploy:${{ inputs.environment }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Post-deploy discovery smoke test
        run: npm run smoke
        env:
          ADVATAB_URL: ${{ vars.ADVATAB_URL }}
          ADVATAB_SETUP_TOKEN: ${{ secrets.ADVATAB_SETUP_TOKEN }}
